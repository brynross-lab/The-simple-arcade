<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hungry Hippo!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, #bfe89a 0%, #9ed46e 55%, #7ec24f 100%);
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
    touch-action: none;
  }
  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* a little pond in the corner, just for scenery/flavor */
  #pond {
    position: absolute;
    right: -40px;
    top: -30px;
    width: 180px;
    height: 140px;
    background: radial-gradient(ellipse at center, #6ec6e8 0%, #4a9fce 100%);
    border-radius: 50%;
    opacity: 0.85;
  }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    z-index: 50;
    pointer-events: none;
  }
  #score {
    font-size: 28px;
    font-weight: bold;
    color: #234a12;
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff;
  }
  #timer {
    font-size: 24px;
    font-weight: bold;
    color: #234a12;
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff;
    background: rgba(255,255,255,0.5);
    padding: 4px 16px;
    border-radius: 20px;
  }
  #timer.urgent {
    color: #c0392b;
    animation: timerPulse 0.5s ease-in-out infinite;
  }
  @keyframes timerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .watermelon {
    position: absolute;
    cursor: pointer;
    filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.25));
    z-index: 20;
  }
  .watermelon.targeted {
    filter: drop-shadow(0 0 8px #fff700) drop-shadow(2px 4px 3px rgba(0,0,0,0.25));
  }

  #hippoWrap {
    position: absolute;
    width: 150px;
    height: 120px;
    z-index: 30;
    pointer-events: none;
  }

  #startScreen, #resultScreen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #bfe89a 0%, #7ec24f 100%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #startScreen h1, #resultScreen h1 {
    font-size: 38px;
    color: #234a12;
    text-shadow: 3px 3px 0 #fff;
    margin-bottom: 10px;
  }
  #startScreen p, #resultScreen p {
    font-size: 17px;
    color: #234a12;
    max-width: 320px;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .bigBtn {
    margin-top: 22px;
    padding: 16px 38px;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    background: #4caf50;
    border: none;
    border-radius: 50px;
    box-shadow: 0 6px 0 #2e7d32;
    cursor: pointer;
    font-family: inherit;
  }
  .bigBtn:active {
    box-shadow: 0 2px 0 #2e7d32;
    transform: translateY(4px);
  }
  #resultScreen { display: none; }
  #resultScore {
    font-size: 32px;
    color: #234a12;
    font-weight: bold;
    margin: 10px 0;
  }

  #tapHint {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    color: #234a12;
    font-weight: bold;
    font-size: 14px;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
    z-index: 40;
    text-align: center;
    pointer-events: none;
    background: rgba(255,255,255,0.6);
    padding: 6px 14px;
    border-radius: 14px;
    max-width: 85%;
  }
</style>
</head>
<body>
<div id="game">

  <div id="pond"></div>

  <div id="hud">
    <div id="score">0</div>
    <div id="timer">0:45</div>
  </div>

  <div id="tapHint">Tap a watermelon and the hippo will run over and eat it! 🦛</div>

  <!-- Full-body hippo, side view, legs animate while running -->
  <div id="hippoWrap">
    <svg id="hippoSvg" viewBox="0 0 150 120" width="100%" height="100%" style="overflow:visible;">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9a9488"/>
          <stop offset="60%" stop-color="#7d766a"/>
          <stop offset="100%" stop-color="#5f594e"/>
        </linearGradient>
        <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b9b2a4"/>
          <stop offset="100%" stop-color="#948d7f"/>
        </linearGradient>
        <radialGradient id="sheenGrad" cx="35%" cy="20%" r="60%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- shadow under the hippo -->
      <ellipse id="hippoShadow" cx="78" cy="106" rx="55" ry="9" fill="#000" opacity="0.18"/>

      <!-- back legs (behind body) -->
      <g id="legBackFar" style="transform-origin: 100px 90px;">
        <rect x="94" y="72" width="16" height="30" rx="7" fill="#6b6455"/>
      </g>
      <g id="legFrontFar" style="transform-origin: 40px 90px;">
        <rect x="34" y="72" width="16" height="30" rx="7" fill="#6b6455"/>
      </g>

      <!-- body -->
      <ellipse cx="78" cy="62" rx="58" ry="34" fill="url(#bodyGrad)"/>
      <ellipse cx="78" cy="74" rx="46" ry="18" fill="url(#bellyGrad)"/>
      <ellipse cx="60" cy="42" rx="45" ry="22" fill="url(#sheenGrad)"/>

      <!-- near legs (in front of body) -->
      <g id="legBackNear" style="transform-origin: 108px 90px;">
        <rect x="102" y="74" width="17" height="32" rx="7.5" fill="#7d766a"/>
      </g>
      <g id="legFrontNear" style="transform-origin: 48px 90px;">
        <rect x="42" y="74" width="17" height="32" rx="7.5" fill="#7d766a"/>
      </g>

      <!-- tail -->
      <path d="M 132 58 Q 145 55 143 68" stroke="#6b6455" stroke-width="7" fill="none" stroke-linecap="round"/>

      <!-- head, at the left (front) of the body -->
      <g id="hippoHeadGroup">
        <ellipse cx="28" cy="52" rx="30" ry="26" fill="url(#bodyGrad)"/>
        <!-- ear -->
        <ellipse cx="18" cy="30" rx="10" ry="12" fill="#6b6455"/>
        <ellipse cx="18" cy="30" rx="5" ry="7" fill="#4a4438"/>
        <!-- eye -->
        <ellipse cx="24" cy="42" rx="5" ry="5.5" fill="#2b271f"/>
        <circle cx="26" cy="40" r="1.6" fill="#fff" opacity="0.8"/>
        <!-- lower jaw, sits fixed - upper snout rotates open away from it -->
        <ellipse cx="4" cy="66" rx="15" ry="10" fill="#7d766a"/>
        <!-- mouth interior, revealed as the jaw opens -->
        <ellipse id="mouthInterior" cx="4" cy="60" rx="13" ry="8" fill="#a8506a" opacity="0"/>
        <!-- upper snout + nostrils, pivots open at the hinge point -->
        <g id="upperSnout" style="transform-origin: 14px 58px;">
          <ellipse cx="6" cy="58" rx="16" ry="14" fill="#8f8878"/>
          <ellipse cx="0" cy="52" rx="4" ry="5" fill="#3a3428"/>
          <ellipse cx="0" cy="64" rx="4" ry="5" fill="#3a3428"/>
        </g>
      </g>
    </svg>
  </div>

  <div id="startScreen">
    <h1>Hungry Hippo!</h1>
    <p>Watermelons are scattered and rolling around the field. Tap one and the hippo will run right over and gobble it up!</p>
    <button class="bigBtn" id="startBtn">PLAY</button>
  </div>

  <div id="resultScreen">
    <h1>Time's Up! 🦛</h1>
    <div id="resultScore">Score: 0</div>
    <p id="resultMsg"></p>
    <button class="bigBtn" id="restartBtn">PLAY AGAIN</button>
  </div>

</div>

<script>
(function() {
  const game = document.getElementById('game');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const hippoWrap = document.getElementById('hippoWrap');
  const hippoHeadGroup = document.getElementById('hippoHeadGroup');
  const upperSnout = document.getElementById('upperSnout');
  const mouthInterior = document.getElementById('mouthInterior');
  const legBackFar = document.getElementById('legBackFar');
  const legFrontFar = document.getElementById('legFrontFar');
  const legBackNear = document.getElementById('legBackNear');
  const legFrontNear = document.getElementById('legFrontNear');
  const tapHint = document.getElementById('tapHint');
  const startScreen = document.getElementById('startScreen');
  const resultScreen = document.getElementById('resultScreen');
  const resultScore = document.getElementById('resultScore');
  const resultMsg = document.getElementById('resultMsg');

  const ROUND_SECONDS = 45;
  const HIPPO_W = 150, HIPPO_H = 120;
  const EAT_DISTANCE = 44; // how close the hippo's mouth needs to get to eat

  let score = 0;
  let running = false;
  let timeLeft = ROUND_SECONDS;
  let timerInterval = null;
  let spawnTimer = null;
  let melons = [];
  let melonIdCounter = 0;
  let speedLevel = 1;

  let hippoX = 0, hippoY = 0; // center position of the hippo
  let facingLeft = true; // hippo art faces left by default (head on the left)
  let targetMelon = null;
  let walkPhase = 0;
  let idleBobPhase = 0;

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;

  function placeHippo(x, y) {
    hippoX = x;
    hippoY = y;
    hippoWrap.style.left = (x - HIPPO_W / 2) + 'px';
    hippoWrap.style.top = (y - HIPPO_H / 2) + 'px';
  }

  function initHippoPosition() {
    placeHippo(W() / 2, H() / 2);
  }

  function makeWatermelonSVG() {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", "100%");
    svg.setAttribute("viewBox", "0 0 60 60");

    const body = document.createElementNS(ns, "circle");
    body.setAttribute("cx", 30); body.setAttribute("cy", 30); body.setAttribute("r", 27);
    body.setAttribute("fill", "#3ba55c");
    body.setAttribute("stroke", "#2a7a42");
    body.setAttribute("stroke-width", "2");
    svg.appendChild(body);

    for (let i = -2; i <= 2; i++) {
      const stripe = document.createElementNS(ns, "path");
      const x = 30 + i * 9;
      stripe.setAttribute("d", `M ${x} 5 Q ${x + i * 4} 30 ${x} 55`);
      stripe.setAttribute("stroke", "#276b39");
      stripe.setAttribute("stroke-width", "4");
      stripe.setAttribute("fill", "none");
      stripe.setAttribute("opacity", "0.55");
      svg.appendChild(stripe);
    }

    const sheen = document.createElementNS(ns, "ellipse");
    sheen.setAttribute("cx", 20); sheen.setAttribute("cy", 18);
    sheen.setAttribute("rx", 8); sheen.setAttribute("ry", 12);
    sheen.setAttribute("fill", "#ffffff");
    sheen.setAttribute("opacity", "0.25");
    svg.appendChild(sheen);

    return svg;
  }

  // Watermelons sit in the field and gently roll/drift in place (small
  // wandering motion), rather than falling or flying across the screen.
  function spawnMelon() {
    if (!running) return;
    if (melons.length >= 8) return; // cap how many are out at once

    const size = 50 + Math.random() * 16;
    const margin = size + 20;
    const x = margin + Math.random() * (W() - margin * 2);
    const y = 90 + Math.random() * (H() - 160);

    const el = document.createElement('div');
    el.className = 'watermelon';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = (x - size / 2) + 'px';
    el.style.top = (y - size / 2) + 'px';
    el.appendChild(makeWatermelonSVG());
    game.appendChild(el);

    const id = melonIdCounter++;
    const melonData = {
      id, el, size, x, y,
      caught: false,
      wanderAngle: Math.random() * Math.PI * 2,
      wanderSpeed: 1.3 + Math.random() * 1.4, // much faster rolling than before
    };
    melons.push(melonData);

    el.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      selectMelon(melonData);
    });
  }

  function removeMelon(melonData) {
    if (melonData.el && melonData.el.parentNode) melonData.el.parentNode.removeChild(melonData.el);
    melons = melons.filter(m => m.id !== melonData.id);
    if (targetMelon === melonData) targetMelon = null;
  }

  function selectMelon(melonData) {
    if (!running || melonData.caught) return;
    if (targetMelon) targetMelon.el.classList.remove('targeted');
    targetMelon = melonData;
    targetMelon.el.classList.add('targeted');
    tapHint.style.display = 'none';
  }

  // Watermelons roll around at real speed and can roll clean off the edge
  // of the screen and disappear (matching real ball physics), rather than
  // bouncing off invisible walls. They occasionally change direction so
  // they don't all beeline straight off-screen immediately.
  const OFFSCREEN_MARGIN = 80; // how far past the edge before despawning
  function wanderMelons() {
    melons.forEach(m => {
      if (m.caught || m === targetMelon) return; // don't wander the one being chased, keeps chase fair
      if (Math.random() < 0.02) {
        m.wanderAngle += (Math.random() - 0.5) * 1.4; // occasional direction change
      }
      m.x += Math.cos(m.wanderAngle) * m.wanderSpeed;
      m.y += Math.sin(m.wanderAngle) * m.wanderSpeed;
      m.el.style.left = (m.x - m.size / 2) + 'px';
      m.el.style.top = (m.y - m.size / 2) + 'px';

      // rolled off-screen - remove it (uncaught, no penalty, just gone)
      if (
        m.x < -OFFSCREEN_MARGIN || m.x > W() + OFFSCREEN_MARGIN ||
        m.y < -OFFSCREEN_MARGIN || m.y > H() + OFFSCREEN_MARGIN
      ) {
        removeMelon(m);
      }
    });
  }

  // Main animation loop: move hippo toward its target, animate legs, eat on arrival
  function gameLoop() {
    if (!running) { requestAnimationFrame(gameLoop); return; }

    wanderMelons();

    if (targetMelon && !targetMelon.caught) {
      const dx = targetMelon.x - hippoX;
      const dy = targetMelon.y - hippoY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < EAT_DISTANCE) {
        eatMelon(targetMelon);
        stopWalking();
      } else {
        const speed = 3.4;
        const nx = hippoX + (dx / dist) * speed;
        const ny = hippoY + (dy / dist) * speed;
        placeHippo(nx, ny);

        // face the direction of travel
        const goingLeft = dx < 0;
        if (goingLeft !== facingLeft) {
          facingLeft = goingLeft;
          hippoWrap.style.transform = facingLeft ? 'scaleX(1)' : 'scaleX(-1)';
        }

        animateWalk();
      }
    } else {
      animateIdle();
    }

    requestAnimationFrame(gameLoop);
  }

  function animateWalk() {
    walkPhase += 0.35;
    const swing = Math.sin(walkPhase) * 22;
    const swingOpp = Math.sin(walkPhase + Math.PI) * 22;
    legFrontNear.style.transform = `rotate(${swing}deg)`;
    legBackFar.style.transform = `rotate(${swing}deg)`;
    legFrontFar.style.transform = `rotate(${swingOpp}deg)`;
    legBackNear.style.transform = `rotate(${swingOpp}deg)`;

    // slight vertical bob while running
    const bob = Math.abs(Math.sin(walkPhase * 2)) * 4;
    document.getElementById('hippoSvg').style.transform = `translateY(${-bob}px)`;

    // mouth chomps open and closed rhythmically while running, hungrily
    const chompOpen = Math.max(0, Math.sin(walkPhase * 1.4));
    setMouthOpen(chompOpen * 0.6); // partial chomp while running, full chomp reserved for the actual eat
  }

  function stopWalking() {
    legFrontNear.style.transform = 'rotate(0deg)';
    legBackFar.style.transform = 'rotate(0deg)';
    legFrontFar.style.transform = 'rotate(0deg)';
    legBackNear.style.transform = 'rotate(0deg)';
    document.getElementById('hippoSvg').style.transform = 'translateY(0px)';
  }

  function animateIdle() {
    idleBobPhase += 0.05;
    const bob = Math.sin(idleBobPhase) * 2;
    document.getElementById('hippoSvg').style.transform = `translateY(${-bob}px)`;
    setMouthOpen(0);
  }

  // amount: 0 (closed) to 1 (fully open) - rotates the upper snout open on
  // its hinge and fades in the mouth interior to match
  function setMouthOpen(amount) {
    const angle = amount * 34; // degrees the snout lifts open
    upperSnout.style.transform = `rotate(${-angle}deg)`;
    mouthInterior.style.opacity = amount;
  }

  function eatMelon(melonData) {
    melonData.caught = true;
    targetMelon = null;

    score += 10;
    scoreEl.textContent = score;
    if (score > 0 && score % 100 === 0) speedLevel += 0.1;

    // big chomp: mouth snaps fully open then shuts, plus a head-scale pulse
    hippoHeadGroup.style.transition = 'transform 0.1s ease-out';
    hippoHeadGroup.style.transform = 'scale(1.15)';
    upperSnout.style.transition = 'transform 0.08s ease-out';
    setMouthOpen(1);

    setTimeout(() => {
      hippoHeadGroup.style.transition = 'transform 0.15s ease-in';
      hippoHeadGroup.style.transform = 'scale(1)';
      upperSnout.style.transition = 'transform 0.15s ease-in';
      setMouthOpen(0);
    }, 140);

    popEffect(melonData.el, '+10');
    removeMelon(melonData);
  }

  function popEffect(el, text) {
    const rect = el.getBoundingClientRect();
    const label = document.createElement('div');
    label.textContent = text;
    label.style.position = 'absolute';
    label.style.left = rect.left + 'px';
    label.style.top = rect.top + 'px';
    label.style.color = '#2a7a42';
    label.style.fontWeight = 'bold';
    label.style.fontSize = '22px';
    label.style.zIndex = 60;
    label.style.pointerEvents = 'none';
    label.style.textShadow = '1px 1px 0 #fff';
    game.appendChild(label);
    label.animate(
      [{ transform: 'translateY(0px) scale(1)', opacity: 1 }, { transform: 'translateY(-40px) scale(1.3)', opacity: 0 }],
      { duration: 500, easing: 'ease-out' }
    );
    setTimeout(() => label.remove(), 500);
  }

  function startGame() {
    score = 0;
    timeLeft = ROUND_SECONDS;
    speedLevel = 1;
    melons.forEach(m => removeMelon(m));
    melons = [];
    targetMelon = null;
    scoreEl.textContent = '0';
    timerEl.textContent = formatTime(timeLeft);
    timerEl.classList.remove('urgent');
    tapHint.style.display = 'block';
    startScreen.style.display = 'none';
    resultScreen.style.display = 'none';
    initHippoPosition();
    facingLeft = true;
    hippoWrap.style.transform = 'scaleX(1)';
    stopWalking();
    running = true;

    scheduleSpawn();
    timerInterval = setInterval(tickTimer, 1000);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function tickTimer() {
    timeLeft--;
    timerEl.textContent = formatTime(Math.max(0, timeLeft));
    if (timeLeft <= 10) timerEl.classList.add('urgent');
    if (timeLeft <= 0) endGame();
  }

  function scheduleSpawn() {
    if (!running) return;
    spawnMelon();
    const delay = Math.max(500, 1100 / speedLevel);
    spawnTimer = setTimeout(scheduleSpawn, delay);
  }

  function endGame() {
    running = false;
    clearTimeout(spawnTimer);
    clearInterval(timerInterval);
    melons.forEach(m => removeMelon(m));

    resultScore.textContent = 'Score: ' + score;
    resultMsg.textContent = score >= 150 ? 'Wow, he was STARVING!' : 'Nice job feeding him!';
    resultScreen.style.display = 'flex';

    try {
      window.parent.postMessage({ type: 'GAME_OVER', score: score }, '*');
    } catch (e) {}
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  initHippoPosition();
  window.addEventListener('resize', () => { if (!running) initHippoPosition(); });
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
