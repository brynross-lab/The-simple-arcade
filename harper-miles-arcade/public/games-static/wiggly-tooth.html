<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wiggly Tooth!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, #ffb3c6 0%, #ff8fab 50%, #ff6f91 100%);
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
    touch-action: none;
  }
  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    z-index: 50;
    pointer-events: none;
  }
  #speedLabel {
    font-size: 20px;
    font-weight: bold;
    color: #7a0d2e;
    text-shadow: 2px 2px 0 #fff;
    background: rgba(255,255,255,0.6);
    padding: 6px 18px;
    border-radius: 20px;
  }

  /* Mouth scene */
  #mouthScene {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #mouthSvgWrap {
    width: 100%;
    max-width: 480px;
    padding: 0 20px;
  }

  #progressWrap {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 360px;
    z-index: 50;
  }
  #progressLabel {
    text-align: center;
    color: #7a0d2e;
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 6px;
    text-shadow: 1px 1px 0 #fff;
  }
  #progressBarOuter {
    background: rgba(255,255,255,0.6);
    border-radius: 20px;
    height: 26px;
    overflow: hidden;
    border: 3px solid #fff;
  }
  #progressBarInner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff6f91, #ff9anb);
    background: linear-gradient(90deg, #ff6f91, #ffb703);
    border-radius: 20px 0 0 20px;
    transition: width 0.08s linear;
  }

  #startScreen, #resultScreen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #ffb3c6 0%, #ff6f91 100%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #startScreen h1, #resultScreen h1 {
    font-size: 38px;
    color: #7a0d2e;
    text-shadow: 3px 3px 0 #fff;
    margin-bottom: 10px;
  }
  #startScreen p, #resultScreen p {
    font-size: 17px;
    color: #7a0d2e;
    max-width: 320px;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .bigBtn {
    margin-top: 22px;
    padding: 16px 38px;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    background: #ff4d6d;
    border: none;
    border-radius: 50px;
    box-shadow: 0 6px 0 #c2184a;
    cursor: pointer;
    font-family: inherit;
  }
  .bigBtn:active {
    box-shadow: 0 2px 0 #c2184a;
    transform: translateY(4px);
  }
  #resultScreen { display: none; }
  #resultScore {
    font-size: 30px;
    color: #7a0d2e;
    font-weight: bold;
    margin: 10px 0;
  }
  #resultTime {
    font-size: 18px;
    color: #7a0d2e;
  }

  .pulse {
    animation: pulse 0.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  #popBurst {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    pointer-events: none;
    opacity: 0;
    z-index: 60;
  }

  #tapHint {
    position: absolute;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    color: #7a0d2e;
    font-weight: bold;
    font-size: 16px;
    text-shadow: 1px 1px 0 #fff;
    z-index: 50;
    text-align: center;
    opacity: 0.95;
  }
</style>
</head>
<body>
<div id="game">

  <div id="hud">
    <div id="speedLabel">Wiggle speed: 0</div>
  </div>

  <div id="mouthScene">
    <div id="mouthSvgWrap">
      <svg id="mouthSvg" viewBox="0 0 400 320" width="100%" style="overflow:visible;">
        <defs>
          <radialGradient id="mouthDark" cx="50%" cy="35%" r="75%">
            <stop offset="0%" stop-color="#4a1220"/>
            <stop offset="100%" stop-color="#26060f"/>
          </radialGradient>
          <linearGradient id="gumGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c96070"/>
            <stop offset="55%" stop-color="#b8505f"/>
            <stop offset="100%" stop-color="#9c3d4a"/>
          </linearGradient>
          <linearGradient id="toothGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fdfaf4"/>
            <stop offset="55%" stop-color="#eee4d3"/>
            <stop offset="85%" stop-color="#d9cbb2"/>
            <stop offset="100%" stop-color="#c4b393"/>
          </linearGradient>
          <linearGradient id="looseToothGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fefcf8"/>
            <stop offset="50%" stop-color="#f5ecd9"/>
            <stop offset="85%" stop-color="#e4d3ae"/>
            <stop offset="100%" stop-color="#cdb888"/>
          </linearGradient>
          <radialGradient id="tongueGrad" cx="50%" cy="15%" r="95%">
            <stop offset="0%" stop-color="#e57b8f"/>
            <stop offset="100%" stop-color="#c25468"/>
          </radialGradient>
          <radialGradient id="toothSheen" cx="35%" cy="20%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
        </defs>

        <!-- zoomed-in mouth interior background -->
        <rect x="0" y="0" width="400" height="320" fill="url(#mouthDark)"/>

        <!-- soft cheek shadows on either side, framing the close-up -->
        <ellipse cx="15" cy="160" rx="75" ry="190" fill="#1a0509" opacity="0.6"/>
        <ellipse cx="385" cy="160" rx="75" ry="190" fill="#1a0509" opacity="0.6"/>

        <!-- upper gumline with subtle mottled texture -->
        <path d="M -20 68 Q 200 6 420 68 L 420 130 Q 200 100 -20 130 Z" fill="url(#gumGrad)"/>
        <g opacity="0.18" filter="url(#softBlur)">
          <ellipse cx="60" cy="90" rx="28" ry="12" fill="#7a2a38"/>
          <ellipse cx="340" cy="88" rx="30" ry="12" fill="#7a2a38"/>
          <ellipse cx="200" cy="75" rx="34" ry="10" fill="#e8899a"/>
        </g>
        <!-- moist highlight along gumline -->
        <path d="M -20 76 Q 200 18 420 76" stroke="#e8899a" stroke-width="3" fill="none" opacity="0.4"/>

        <!-- lower gumline -->
        <path d="M -20 252 Q 200 302 420 252 L 420 198 Q 200 222 -20 198 Z" fill="url(#gumGrad)"/>
        <g opacity="0.18" filter="url(#softBlur)">
          <ellipse cx="70" cy="235" rx="28" ry="12" fill="#7a2a38"/>
          <ellipse cx="330" cy="238" rx="30" ry="12" fill="#7a2a38"/>
        </g>
        <path d="M -20 246 Q 200 290 420 246" stroke="#e8899a" stroke-width="3" fill="none" opacity="0.35"/>

        <!-- tongue peeking up from below, with center groove for realism -->
        <ellipse cx="200" cy="302" rx="185" ry="62" fill="url(#tongueGrad)"/>
        <path d="M 200 250 Q 195 280 200 320" stroke="#a8425a" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>
        <path d="M 70 280 Q 200 258 330 280" stroke="#a8425a" stroke-width="2.5" fill="none" opacity="0.3"/>
        <ellipse cx="200" cy="270" rx="130" ry="20" fill="#ffffff" opacity="0.12"/>

        <!-- upper teeth row (zoomed, more naturally irregular shapes/sizes) -->
        <g id="upperTeeth" fill="url(#toothGrad)" stroke="#a89478" stroke-width="1.5">
          <path d="M -30 92 L 12 88 Q 18 118 20 142 Q 0 158 -25 150 Q -30 120 -30 92 Z"/>
          <path d="M 16 86 L 76 82 Q 80 116 80 146 Q 52 164 22 148 Q 18 116 16 86 Z"/>
          <path d="M 318 82 L 378 86 Q 376 116 372 148 Q 344 164 316 146 Q 316 116 318 82 Z"/>
          <path d="M 382 88 L 424 92 Q 424 120 420 150 Q 396 158 376 142 Q 378 118 382 88 Z"/>
        </g>
        <!-- ambient occlusion shadow where each tooth meets the gum -->
        <g fill="#5c1c28" opacity="0.4" filter="url(#softBlur)">
          <ellipse cx="-8" cy="93" rx="24" ry="7"/>
          <ellipse cx="46" cy="87" rx="32" ry="7"/>
          <ellipse cx="348" cy="87" rx="32" ry="7"/>
          <ellipse cx="403" cy="93" rx="24" ry="7"/>
        </g>
        <!-- subtle sheen on each tooth for a moist/realistic look -->
        <g opacity="0.5">
          <ellipse cx="-10" cy="105" rx="10" ry="20" fill="url(#toothSheen)"/>
          <ellipse cx="38" cy="100" rx="12" ry="24" fill="url(#toothSheen)"/>
          <ellipse cx="330" cy="100" rx="12" ry="24" fill="url(#toothSheen)"/>
          <ellipse cx="398" cy="105" rx="10" ry="20" fill="url(#toothSheen)"/>
        </g>

        <!-- lower teeth row -->
        <g fill="url(#toothGrad)" stroke="#a89478" stroke-width="1.5">
          <path d="M -28 222 L 24 218 Q 22 195 18 178 Q -4 168 -28 178 Q -28 200 -28 222 Z"/>
          <path d="M 28 218 L 84 214 Q 80 188 74 172 Q 48 162 30 174 Q 26 196 28 218 Z"/>
          <path d="M 318 214 L 372 218 Q 374 196 370 174 Q 350 162 324 172 Q 320 190 318 214 Z"/>
          <path d="M 376 218 L 428 222 Q 428 200 424 178 Q 402 168 380 178 Q 378 196 376 218 Z"/>
        </g>
        <g fill="#5c1c28" opacity="0.35" filter="url(#softBlur)">
          <ellipse cx="-2" cy="216" rx="26" ry="7"/>
          <ellipse cx="54" cy="212" rx="30" ry="7"/>
          <ellipse cx="346" cy="212" rx="30" ry="7"/>
          <ellipse cx="402" cy="216" rx="26" ry="7"/>
        </g>

        <!-- the wiggly tooth (interactive) - centered, larger, zoomed, rounder/more organic crown -->
        <g id="wigglyTooth" style="cursor:pointer;" transform-origin="200 130">
          <!-- root shadow visible in gum, showing it's loosened -->
          <ellipse cx="200" cy="96" rx="44" ry="15" fill="#5c1c28" opacity="0.55" filter="url(#softBlur)"/>
          <path d="M 150 90 Q 160 70 200 66 Q 240 70 250 90 Q 254 122 246 152 Q 238 174 200 182 Q 162 174 154 152 Q 146 122 150 90 Z"
                fill="url(#looseToothGrad)" stroke="#a89478" stroke-width="2"/>
          <!-- vertical enamel ridges for a rounder, more realistic tooth surface -->
          <path d="M 178 78 Q 172 120 180 168" stroke="#d3c09a" stroke-width="1.5" opacity="0.5" fill="none"/>
          <path d="M 222 78 Q 228 120 220 168" stroke="#d3c09a" stroke-width="1.5" opacity="0.5" fill="none"/>
          <!-- moist sheen highlight -->
          <ellipse cx="182" cy="100" rx="16" ry="34" fill="url(#toothSheen)" opacity="0.7"/>
          <!-- little wobble lines to hint it's loose -->
          <path id="wobbleHintL" d="M 128 108 Q 118 122 128 136" stroke="#ffe6ea" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path id="wobbleHintR" d="M 272 108 Q 282 122 272 136" stroke="#ffe6ea" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
        </g>
      </svg>
    </div>
    <div style="position:absolute; bottom:6px; left:0; right:0; text-align:center; color:rgba(255,255,255,0.5); font-size:11px;">tilt phone away from face while playing 🙂</div>
  </div>

  <div id="popBurst">✨🦷✨</div>

  <div id="tapHint">Tap the wobbly tooth to grab it!</div>

  <div id="progressWrap" style="display:none;">
    <div id="progressLabel">Wiggle it loose!</div>
    <div id="progressBarOuter">
      <div id="progressBarInner"></div>
    </div>
  </div>

  <div id="startScreen">
    <h1>Wiggly Tooth!</h1>
    <p>Tap the loose tooth to grab it, then swipe your finger back and forth as FAST as you can to wiggle it out!</p>
    <button class="bigBtn" id="startBtn">PLAY</button>
  </div>

  <div id="resultScreen">
    <h1 id="resultTitle">Out it came! 🦷</h1>
    <div id="resultScore">Score: 0</div>
    <div id="resultTime"></div>
    <button class="bigBtn" id="restartBtn">PLAY AGAIN</button>
  </div>

</div>

<script>
(function() {
  const game = document.getElementById('game');
  const wigglyTooth = document.getElementById('wigglyTooth');
  const wobbleHintL = document.getElementById('wobbleHintL');
  const wobbleHintR = document.getElementById('wobbleHintR');
  const speedLabel = document.getElementById('speedLabel');
  const progressWrap = document.getElementById('progressWrap');
  const progressBarInner = document.getElementById('progressBarInner');
  const progressLabel = document.getElementById('progressLabel');
  const tapHint = document.getElementById('tapHint');
  const startScreen = document.getElementById('startScreen');
  const resultScreen = document.getElementById('resultScreen');
  const resultScore = document.getElementById('resultScore');
  const resultTime = document.getElementById('resultTime');
  const popBurst = document.getElementById('popBurst');

  let state = 'idle'; // idle -> grabbed -> wiggling -> popped
  let grabbedAt = 0;
  let progress = 0; // 0 to 100
  let lastDirX = null;
  let lastSwipeTime = 0;
  let swipeCount = 0;
  let displaySpeed = 0;
  let rafId = null;
  let pointerStartX = null;
  let pointerLastX = null;

  function resetGame() {
    state = 'idle';
    progress = 0;
    swipeCount = 0;
    displaySpeed = 0;
    lastDirX = null;
    progressBarInner.style.width = '0%';
    speedLabel.textContent = 'Wiggle speed: 0';
    progressWrap.style.display = 'none';
    tapHint.style.display = 'block';
    tapHint.textContent = 'Tap the wobbly tooth to grab it!';
    wigglyTooth.classList.add('pulse');
    wigglyTooth.setAttribute('transform', '');
    popBurst.style.opacity = '0';
    resultScreen.style.display = 'none';
    startScreen.style.display = 'flex';
  }

  function startRound() {
    startScreen.style.display = 'none';
    resultScreen.style.display = 'none';
    state = 'idle';
    progress = 0;
    swipeCount = 0;
    lastDirX = null;
    progressBarInner.style.width = '0%';
    progressWrap.style.display = 'none';
    tapHint.style.display = 'block';
    tapHint.textContent = 'Tap the wobbly tooth to grab it!';
    wigglyTooth.classList.add('pulse');
  }

  wigglyTooth.addEventListener('pointerdown', (e) => {
    if (state !== 'idle') return;
    e.stopPropagation();
    grabTooth();
  });

  function grabTooth() {
    state = 'grabbed';
    grabbedAt = performance.now();
    wigglyTooth.classList.remove('pulse');
    tapHint.style.display = 'none';
    progressWrap.style.display = 'block';
    progressLabel.textContent = 'Swipe back and forth FAST!';
    startWiggleListening();
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  function startWiggleListening() {
    game.addEventListener('pointerdown', onPointerDown);
    game.addEventListener('pointermove', onPointerMove);
    game.addEventListener('pointerup', onPointerUp);
    game.addEventListener('pointercancel', onPointerUp);
  }

  function stopWiggleListening() {
    game.removeEventListener('pointerdown', onPointerDown);
    game.removeEventListener('pointermove', onPointerMove);
    game.removeEventListener('pointerup', onPointerUp);
    game.removeEventListener('pointercancel', onPointerUp);
  }

  function onPointerDown(e) {
    if (state !== 'grabbed') return;
    pointerStartX = e.clientX;
    pointerLastX = e.clientX;
  }

  function onPointerMove(e) {
    if (state !== 'grabbed' || pointerLastX === null) return;
    const dx = e.clientX - pointerLastX;
    const threshold = 8; // minimum movement to count as intentional swipe

    if (Math.abs(dx) > threshold) {
      const dir = dx > 0 ? 1 : -1;
      if (lastDirX !== null && dir !== lastDirX) {
        // direction reversed = one "wiggle" completed
        registerSwipe();
      }
      lastDirX = dir;
      pointerLastX = e.clientX;

      // visual: rock the tooth left/right a bit while wiggling
      const rockAngle = dir * 8;
      wigglyTooth.setAttribute('transform', `rotate(${rockAngle} 200 120)`);
    }
  }

  function onPointerUp() {
    pointerStartX = null;
    pointerLastX = null;
  }

  function registerSwipe() {
    const now = performance.now();
    const dt = now - lastSwipeTime;
    lastSwipeTime = now;
    swipeCount++;

    // convert time-between-swipes into a speed score (faster = higher)
    let speedScore = 0;
    if (dt > 0 && dt < 2000) {
      speedScore = Math.min(100, 6000 / dt); // dt ~60ms -> ~100, dt ~600ms -> ~10
    }
    displaySpeed = Math.round(speedScore);
    speedLabel.textContent = 'Wiggle speed: ' + displaySpeed;

    // progress gained scales with speed - fast wiggles make meaningfully
    // faster progress. Reduced to ~1/3 of the previous rate so the wiggle
    // takes about 3x longer overall.
    const gain = 0.27 + (speedScore / 100) * 1.4; // between ~0.27 (slow) and ~1.67 (fast) per swipe
    progress = Math.min(100, progress + gain);
    progressBarInner.style.width = progress + '%';

    if (progress >= 100) {
      popOut();
    }
  }

  function tick(now) {
    if (state !== 'grabbed') { rafId = null; return; }

    // decay speed display / progress rate slowly if no recent swipe (feedback that stopping = slower)
    if (performance.now() - lastSwipeTime > 500) {
      displaySpeed = Math.max(0, displaySpeed - 2);
      speedLabel.textContent = 'Wiggle speed: ' + displaySpeed;
    }

    rafId = requestAnimationFrame(tick);
  }

  function popOut() {
    state = 'popped';
    stopWiggleListening();
    wigglyTooth.setAttribute('transform', '');

    const totalTime = ((performance.now() - grabbedAt) / 1000).toFixed(1);
    // score: faster overall time = higher score, with a floor/ceiling for sane values
    const finalScore = Math.max(10, Math.round(2000 / Math.max(0.5, totalTime)));

    popBurst.style.transition = 'none';
    popBurst.style.opacity = '1';
    popBurst.style.transform = 'translate(-50%, -50%) scale(0.6)';
    requestAnimationFrame(() => {
      popBurst.style.transition = 'transform 0.5s ease-out, opacity 0.5s ease-out';
      popBurst.style.transform = 'translate(-50%, -80%) scale(1.4)';
      popBurst.style.opacity = '0';
    });

    setTimeout(() => {
      resultScore.textContent = 'Score: ' + finalScore;
      resultTime.textContent = 'Pulled in ' + totalTime + 's with ' + swipeCount + ' wiggles!';
      resultScreen.style.display = 'flex';

      try {
        window.parent.postMessage({ type: 'GAME_OVER', score: finalScore }, '*');
      } catch (e) {}
    }, 550);
  }

  document.getElementById('startBtn').addEventListener('click', startRound);
  document.getElementById('restartBtn').addEventListener('click', startRound);

  resetGame();
})();
</script>
</body>
</html>
